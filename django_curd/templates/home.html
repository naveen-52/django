<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>List of the Student</h2>
    <a href="/add/">Add Student</a>

    <table border="1">
       <tr>
        <td>Name</td>
        <td>Age</td>
        <td>Department</td>
        <td>Action</td>
       </tr>
       {% for i in students %}
       <tr>
        <td>{{i.name}}</td>
        <td>{{i.age}}</td>
        <td>{{i.department}}</td>
        <td><a href="/edit/{{i.id}}/">Edit</a> |
            <a href="/delete/{{i.id}}/">Delete</a>
        </td>
       </tr>
       {% endfor %}
    </table>
</body>
</html>
